name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  # -------------------------------------------------------------
  # Job 1: Lọc thư mục có file thay đổi
  # -------------------------------------------------------------
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      client: ${{ steps.filter.outputs.client }}
      server: ${{ steps.filter.outputs.server }}
      ai_service: ${{ steps.filter.outputs.ai_service }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Check Paths
        uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            client:
              - 'client/**'
              - '.github/workflows/ci.yml'
            server:
              - 'server/**'
              - '.github/workflows/ci.yml'
            ai_service:
              - 'ai_service/**'
              - '.github/workflows/ci.yml'

  # -------------------------------------------------------------
  # Job 2: Kiểm tra Front-end (Client)
  # -------------------------------------------------------------
  client-check:
    name: Client (Lint, Test & Build)
    needs: changes
    if: ${{ needs.changes.outputs.client == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Test Build Production
        run: npm run build

  # -------------------------------------------------------------
  # Job 3: Kiểm tra Back-end (Server)
  # -------------------------------------------------------------
  server-check:
    name: Server (Prisma & Vitest)
    needs: changes
    if: ${{ needs.changes.outputs.server == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    # Khởi tạo PostgreSQL DB tạm thời cho runner
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Node.js 20
        uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Database Tests
        env:
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db?schema=public
          JWT_SECRET: test_secret_key_ci
        run: npm test

  # -------------------------------------------------------------
  # Job 4: Kiểm tra AI Microservice (FastAPI)
  # -------------------------------------------------------------
  ai-service-check:
    name: AI Service (Flake8 & Pytest)
    needs: changes
    if: ${{ needs.changes.outputs.ai_service == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Setup Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_service/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest pytest-asyncio httpx

      - name: Lint Code
        run: |
          # Dừng nếu có lỗi syntax hoặc undefined name
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run Tests
        env:
          INTERNAL_API_KEY: ci_test_key
          OPENAI_API_KEY: test-ci-dummy-key
          DEEPSEEK_API_KEY: test-ci-dummy-key
        run: pytest
