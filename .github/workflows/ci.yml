# D:/SWP391/SWP391/.github/workflows/ci.yml
name: CI Pipeline - Code Quality & Automated Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # 1. CLIENT QUALITY & AUTOMATED TESTS (React 19 + Vite)
  # =========================================================================
  client-tests:
    name: Frontend Quality & Tests (client/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Install Client Dependencies
        run: npm ci

      - name: Run Frontend Automated Tests
        run: npm test

      - name: Build Frontend Production Artifact
        run: npm run build

  # =========================================================================
  # 2. SERVER QUALITY & AUTOMATED TESTS (Express + Prisma + PostgreSQL)
  # =========================================================================
  server-tests:
    name: Backend Quality & Tests (server/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_password
          POSTGRES_DB: vegetarian_db_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d vegetarian_db_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      PORT: 5000
      NODE_ENV: test
      CLIENT_URL: http://localhost:5173
      DATABASE_URL: "postgresql://postgres:postgres_password@localhost:5432/vegetarian_db_test"
      JWT_SECRET: "ci_test_super_secret_jwt_key_swp391_2026"
      JWT_EXPIRES_IN: "7d"
      AI_SERVICE_URL: "http://127.0.0.1:8000"
      INTERNAL_API_KEY: "chayxanh_internal_secure_key_2026"
      GUEST_DAILY_LIMIT: 3

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install Server Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Push Database Schema to PostgreSQL
        run: npx prisma db push --skip-generate

      - name: Seed Database with Initial Data
        run: npm run seed

      - name: Run Backend Vitest Test Suite
        run: npm test

  # =========================================================================
  # 3. AI SERVICE QUALITY & AUTOMATED TESTS (FastAPI + LangChain)
  # =========================================================================
  ai-service-tests:
    name: AI Microservice Quality & Tests (ai_service/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_service

    env:
      INTERNAL_API_KEY: "chayxanh_internal_secure_key_2026"
      DEEPSEEK_API_KEY: "test-deepseek-ci-key"
      DEBUG: "false"
      RATE_LIMIT: "100000/minute"
      TRUSTED_PROXIES: "testclient,127.0.0.1"

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: ai_service/requirements.txt

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run AI Microservice Pytest Suite
        run: pytest
